<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exclusive Eyes Memo</title>
<style>
:root{--bg:#F3F4F7;--card:#fff;--ink:#14213D;--mute:#667085;--line:#DDE1E8;--navy:#0F2557;--acc:#D9622B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F141C;--card:#18202B;--ink:#EEF1F5;--mute:#9AA4B2;--line:#2A3441;--navy:#8FB2E0;--acc:#F08650}}
:root[data-theme="dark"]{--bg:#0F141C;--card:#18202B;--ink:#EEF1F5;--mute:#9AA4B2;--line:#2A3441;--navy:#8FB2E0;--acc:#F08650}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 40px}
h2{font-size:18px;margin:24px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;min-height:44px}
textarea{min-height:64px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 16px;font:500 15px system-ui,sans-serif;cursor:pointer;min-height:44px;flex:1}
.btn.alt{background:transparent;color:var(--navy);border:1px solid var(--line)}
.btns{display:flex;gap:10px;margin-top:12px}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:15px}
.chk input{width:22px;min-height:22px;height:22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30}
#fit{width:100%;overflow:hidden;border-radius:6px;box-shadow:0 1px 8px rgba(0,0,0,.18)}
#sheet{width:794px;background:#fff;color:#0F2557;font-family:Arial,Helvetica,sans-serif;font-size:15px;transform-origin:top left}
#sheet .hd{display:flex;justify-content:space-between;align-items:center;padding:30px 36px 0}
#sheet .hd img{height:78px}
#sheet .mm{width:340px;text-align:center;border-top:5px solid #0F2557;border-bottom:5px solid #0F2557;font-size:44px;font-weight:700;letter-spacing:6px;padding:6px 0}
#sheet .info{display:flex;padding:22px 36px;gap:0}
#sheet .info .l{flex:1;border-right:2px solid #0F2557;padding-right:20px;line-height:1.6}
#sheet .info .l b{font-size:24px;display:block;margin-bottom:4px}
#sheet .info .r{flex:1;padding-left:24px}
#sheet .info .r div{display:flex;padding:4px 0}
#sheet .info .r span{width:110px;font-weight:700}
#sheet .info .r em{font-style:normal;flex:1;word-break:break-word}
#sheet .bx{margin:6px 36px 20px;border:1.5px solid #0F2557}
#sheet .bx .t{background:#0F2557;color:#fff;font-weight:700;padding:9px 14px;letter-spacing:.5px}
#sheet .bx .rw{display:flex;padding:6px 14px}
#sheet .bx .rw b{width:140px}
#sheet table{width:calc(100% - 72px);margin:0 36px;border-collapse:collapse}
#sheet th{background:#0F2557;color:#fff;padding:11px 8px;font-size:15px}
#sheet td{border:1.5px solid #0F2557;padding:10px 12px}
#sheet td.c{text-align:center;width:70px}
#sheet td.d{font-weight:700}
#sheet td.a{text-align:right;width:170px}
#sheet tr.tt td{font-weight:700;font-size:17px;border-left:0}
#sheet tr.tt td.a{background:#0F2557;color:#fff}
#sheet .wd{margin:22px 36px;border:1.5px solid #0F2557;padding:12px 16px}
#sheet .sg{display:flex;justify-content:space-between;align-items:flex-end;padding:6px 36px 10px}
#sheet .sg .ln{border-top:2px dotted #0F2557;width:300px;margin-top:78px;padding-top:8px;position:relative}
#sheet .sig{position:absolute;left:6px;bottom:100%;margin-bottom:-6px;font-family:"Mrs Saint Delafield","Snell Roundhand","Segoe Script","Brush Script MT",cursive;font-size:72px;line-height:1;color:#1B2F8F;transform:rotate(-4deg);transform-origin:left bottom;white-space:nowrap}
#sheet .ty{display:flex;align-items:center;gap:16px;padding:10px 36px;font-style:italic;font-weight:700;color:#0F2557}
#sheet .ty:before,#sheet .ty:after{content:"";flex:1;border-top:3px solid #0F2557}
#sheet .ft{background:#0F2557;color:#fff;display:flex;justify-content:space-between;padding:20px 36px;margin-top:8px;font-size:14px;gap:20px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:12px}
.ov img{width:100%;max-width:560px;background:#fff;border-radius:4px}
.ovt{color:#fff;font-size:14px;text-align:center}
.ov .btns{width:100%;max-width:560px}
@media print{@page{size:A4;margin:0}body{background:#fff}body::before,.edit,.btns{display:none!important}.wrap{padding:0;max-width:none}#fit{box-shadow:none;height:auto!important;overflow:visible}#sheet{transform:none!important}}
</style>
</head>
<body>
<div class="wrap">
<div class="edit">
<h2>Memo details</h2>
<div class="card">
<div class="g2"><div><label>CN No. (auto)</label><input id="no" inputmode="numeric"></div><div><label>Currency</label><select id="cur"><option value="BDT">BDT</option><option value="USD">USD</option></select></div></div>
<label>Date</label><input id="dt" type="date">
<label>Buyer name</label><input id="bn">
<div class="g2"><div><label>Country</label><input id="bc"></div><div><label>Contact</label><input id="bt" inputmode="tel"></div></div>
<label>Buyer address</label><textarea id="ba"></textarea>
</div>
<h2>Product and payment</h2>
<div class="card">
<label>Product category</label><select id="cat"><option>T-shirt</option><option>Polo shirt</option><option>Hoodie</option><option>Sweatshirt</option><option>Jogger</option><option>Jacket</option><option>Shirt</option><option>Trouser</option><option>Other</option></select>
<label>Product details</label><input id="det" placeholder="Style no., color, fabric">
<div class="g2"><div><label>Quantity (pcs)</label><input id="qty" type="number" inputmode="numeric"></div><div><label>Price per piece</label><input id="pr" type="number" inputmode="decimal" step="0.01"></div></div>
<label>Advance payment received</label><input id="adv" type="number" inputmode="decimal" step="0.01">
</div>
<h2>Your company (saved on this phone)</h2>
<div class="card">
<label>Address</label><textarea id="ca" placeholder="Factory or office address"></textarea>
<div class="g2"><div><label>Email</label><input id="ce" type="email"></div><div><label>Phone</label><input id="cp" inputmode="tel"></div></div>
<input id="sn" type="hidden">
<label class="chk"><input id="stp" type="checkbox" checked> Show company stamp</label>
</div>
</div>
<h2 class="edit">Preview</h2>
<div id="fit"><div id="sheet"></div></div>
<div class="btns"><button class="btn" onclick="dlImage()">Download invoice image</button></div>
<div class="btns"><button class="btn" onclick="copyTxt()">Copy as text</button><button class="btn alt" onclick="window.print()">Print or save PDF</button></div>
<div class="btns"><button class="btn" style="background:var(--navy);color:var(--bg)" onclick="nextMemo()">Done: save and start next memo</button></div>
</div>
<div id="toast"></div>
